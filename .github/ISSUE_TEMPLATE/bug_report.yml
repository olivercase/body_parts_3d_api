name: Bug report
description: Something in the downloader or the subset selector does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security problems here — see
        [SECURITY.md](https://github.com/olivercase/body_parts_3d_api/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact command you ran, and the output. Paste text rather than a screenshot.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which tool
      options:
        - download_bodyparts3d_4.3.py (the full-set downloader)
        - bp3d_subset.py (the subset selector)
        - The mesh set or MANIFEST.csv itself
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python and OS
      placeholder: "Python 3.12.3, macOS 15.6 / Ubuntu 24.04"
    validations:
      required: true
  - type: checkboxes
    id: lfs
    attributes:
      label: Git LFS
      description: Most "the mesh is a few hundred bytes of text" reports are an LFS clone that was never pulled.
      options:
        - label: I have run `git lfs pull`, or the problem does not involve mesh files
